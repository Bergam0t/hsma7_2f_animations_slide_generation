project:
  title: "Title"
  # output-dir is deliberately NOT set here -- see the render commands in
  # README.md/notes.md (`quarto render --output-dir docs`). Setting it in
  # this file makes Quarto anchor `quarto preview <file>` for any ad-hoc
  # file (e.g. a single _SECTION_*.qmd, not in project.render) at output-dir
  # as its web root, even though that file's own rendered output still lands
  # next to the source at the project root -- the preview server then can't
  # actually serve it (browser gets a broken /../<file>.html 404). Passing
  # --output-dir on the command line only for real full-deck renders avoids
  # that without breaking single-section preview.
  execute-dir: project
  resources:
    - assets/

  # Only render the deck itself. Without this, Quarto also renders every other
  # top-level .md / .ipynb file (README, LICENCE, scratch notebooks) into
  # output-dir as its own standalone page.
  # NOTE: if you rename slides.qmd, change this to match.
  render:
    - slides.qmd

  # Quarto's default (non-website) project type copies the WHOLE project
  # directory into output-dir on every render, and it ignores .gitignore.
  # This hook deletes everything in output-dir that isn't listed in docs-keep
  # below. Please don't remove it -- without it, docs/ silently accumulates
  # your source files, data folders, __pycache__, lockfiles and multi-MB
  # Jupyter intermediates, and GitHub Pages publishes the lot.
  post-render:
    - _docs_vendor_widget_assets.py
    - _docs_cleanup.py

# Everything in output-dir NOT listed here is deleted after each render.
# Add any folder your deck links to at runtime -- extra images, PDFs, data
# files, handouts. If you drop an entry the deck actually needs, the deck
# breaks silently on the published site, so check it after editing this list.
#
# This is the default profile's list (-> docs/, this deck's own output only).
# The nhs_oa profile has its own docs-keep in _quarto-nhs_oa.yml -- keep them
# separate, don't list index_nhs_oa.html/slides_nhs_oa_files here, otherwise
# _docs_cleanup.py can't tell that deck's stray mirrored files apart from
# docs/'s real contents.
docs-keep:
  - index.html
  - slides_files
  - assets
  - .nojekyll
  - _extensions
  - _freeze
  - custom.scss
  - _brand.yml
  - resources
  - code_examples
  - fullscreen
  - diagrams
  - sample_code

format:
  revealjs:
    execute:
      freeze: auto
