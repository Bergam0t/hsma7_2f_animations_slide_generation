# Quarto project profile: renders slides_nhs_oa.qmd instead of slides.qmd.
# Activate with:
#
#   quarto render --profile nhs_oa --output-dir docs_nhs_oa
#
# Quarto merges this on top of _quarto.yml when that profile is active --
# see https://quarto.org/docs/projects/profiles.html. project.render is
# replaced wholesale (not merged) by this override.
#
# output-dir is NOT set here, same reasoning as _quarto.yml -- always pass
# --output-dir docs_nhs_oa on the command line instead, so it doesn't also
# get inherited by an ad-hoc `quarto preview _SECTION_foo.qmd --profile
# nhs_oa` and break that the same way a YAML-set output-dir did for the
# default profile.
project:
  render:
    - slides_nhs_oa.qmd

# This profile's own allowlist for _docs_cleanup.py -- deliberately separate
# from _quarto.yml's docs-keep (index.html/slides_files belong to the
# default deck, not this one) so a stray mirrored copy of the other deck's
# output gets cleaned up rather than kept.
docs-keep:
  - index_nhs_oa.html
  - slides_nhs_oa_files
  - assets
  - .nojekyll
  - _extensions
  - _freeze
  - custom.scss
  - _brand.yml
  - resources
  - code_examples
  - fullscreen
  - diagrams
  - sample_code
